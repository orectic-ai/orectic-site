<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Source template for /public/og-image.png (1200x630). Rendered headlessly. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  #card{
    width:1200px;height:630px;position:relative;background:#05060A;color:#EDF0F5;
    background-image:linear-gradient(rgba(134,199,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(134,199,214,.06) 1px,transparent 1px);
    background-size:46px 46px;font-family:'Space Grotesk',sans-serif;
    padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .top{display:flex;align-items:center;gap:14px}
  .logo{width:34px;height:34px;border:1.5px solid #C98B72;display:grid;place-items:center;font-family:'IBM Plex Mono';color:#C98B72;font-size:17px}
  .brand{font-weight:500;letter-spacing:.22em;font-size:20px}
  .eyebrow{font-family:'IBM Plex Mono';font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#C98B72;margin-bottom:22px}
  .eyebrow:before{content:"[ "}.eyebrow:after{content:" ]"}
  h1{font-weight:300;font-size:72px;line-height:1.04;max-width:17ch;letter-spacing:-.015em}
  h1 b{font-weight:500;color:#C98B72}
  .row{display:flex;border:1px solid rgba(154,163,178,.18)}
  .row div{flex:1;padding:16px 22px;border-right:1px solid rgba(154,163,178,.18)}
  .row div:last-child{border-right:none}
  .row .n{font-family:'IBM Plex Mono';font-size:12px;color:#7C8293;letter-spacing:.12em}
  .row .v{font-size:18px;margin-top:6px}
</style>
</head>
<body>
  <div id="card">
    <div class="top"><span class="logo">O</span><span class="brand">ORECTIC</span></div>
    <div>
      <div class="eyebrow">Governed intent-to-execution infrastructure</div>
      <h1>The operating system for <b>governed intelligence.</b></h1>
    </div>
    <div class="row">
      <div><div class="n">LAYER 01</div><div class="v">Orectic · the system</div></div>
      <div><div class="n">LAYER 02</div><div class="v">OVAE · the surface</div></div>
      <div><div class="n">CYCLE</div><div class="v">Intent → … → Learning</div></div>
    </div>
  </div>
</body>
</html>
